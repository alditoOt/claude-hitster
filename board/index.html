<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitster Board</title>
<style>
  :root {
    --bg: #14101f; --bg2: #1d1730; --line: #382d57;
    --text: #f4f0ff; --muted: #a89fc4; --accent: #ff4d8d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 700px at 50% -10%, #3a1f66 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 14px; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  a { color: var(--muted); font-size: .85rem; }
  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sq {
    aspect-ratio: 1; border-radius: 12px; border: 2px solid; padding: 0; cursor: pointer;
    color: var(--c); border-color: var(--c);
    background: color-mix(in srgb, var(--c) 18%, transparent);
    box-shadow: 0 0 12px color-mix(in srgb, var(--c) 40%, transparent), inset 0 0 10px color-mix(in srgb, var(--c) 20%, transparent);
    transition: transform .1s, background .15s;
  }
  .sq:active { transform: scale(.95); }
  .sq.on { background: var(--c); box-shadow: 0 0 20px var(--c); }
  .sq.on::after { content: "✓"; color: #120d1f; font-size: clamp(1rem, 6vw, 1.8rem); font-weight: 900; }
  .tools { display: flex; gap: 10px; margin: 14px 0; }
  button.btn {
    font: inherit; font-weight: 700; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #a64dff);
  }
  button.btn.ghost { background: var(--bg2); border: 1px solid var(--line); font-weight: 600; }
  label { display: block; color: var(--muted); font-size: .85rem; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 110px; resize: vertical; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hitster <span>Board</span></h1>
    <a href="/">← Spinner</a>
  </header>

  <div class="board" id="board" role="grid" aria-label="Colored bingo board"></div>

  <div class="tools">
    <button class="btn" id="shuffle">Shuffle colors</button>
    <button class="btn ghost" id="clear">Clear marks</button>
  </div>

  <label for="notes">Notes</label>
  <textarea id="notes" placeholder="Write anything here…"></textarea>
</div>

<script>
// Same neon palette as the spinner on the main page.
const NEON = ['#39ff88', '#ff3ea5', '#ffe600', '#b44dff', '#2ec4ff'];
const KEY = 'hitster-board-v1';
const boardEl = document.getElementById('board');
const notesEl = document.getElementById('notes');

let state = load() || fresh();

function fresh() {
  // 25 squares / 5 colors = exactly 5 of each, shuffled (Fisher-Yates)
  const colors = NEON.flatMap(c => Array(5).fill(c));
  for (let i = colors.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [colors[i], colors[j]] = [colors[j], colors[i]];
  }
  return { colors, marks: Array(25).fill(false), notes: '' };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.colors && s.colors.length === 25 ? s : null; } catch { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

function render() {
  boardEl.innerHTML = '';
  state.colors.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'sq' + (state.marks[i] ? ' on' : '');
    b.style.setProperty('--c', c);
    b.setAttribute('aria-pressed', state.marks[i]);
    b.addEventListener('click', () => { state.marks[i] = !state.marks[i]; save(); render(); });
    boardEl.appendChild(b);
  });
  notesEl.value = state.notes;
}

document.getElementById('shuffle').onclick = () => { state = { ...fresh(), notes: state.notes }; save(); render(); };
document.getElementById('clear').onclick = () => { state.marks.fill(false); save(); render(); };
notesEl.addEventListener('input', () => { state.notes = notesEl.value; save(); });

render();
</script>
</body>
</html>
